# Nadie entra sin usuario y clave. Cada pastillero solo ve sus propios temas (ver acl).
per_listener_settings false
allow_anonymous false
password_file /mosquitto/secretos/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Dentro de Docker: la API de Laravel (este puerto no se publica en la EC2)
listener 1883

# Afuera: los pastilleros, con el mismo certificado HTTPS que saca Caddy (lo copia instalar.sh)
listener 8883
certfile /mosquitto/secretos/cert.pem
keyfile /mosquitto/secretos/key.pem
