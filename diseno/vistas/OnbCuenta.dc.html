<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crea tu rutina: cuenta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D7385}a:hover{color:#0A4A66}
::selection{background:#BDE6EE;color:#0E2733}
.back{width:44px;height:44px;border-radius:14px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#0E2733;box-shadow:0 6px 16px -10px rgba(10,74,102,.45);flex-shrink:0}
.seg{height:6px;border-radius:3px;background:#D6E5EA}
.seg.on{background:#0D7385}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:18px;background:linear-gradient(135deg,#0E7C8E,#0D7385 55%,#0A4A66);color:#FFFFFF;font-size:18px;font-weight:700;text-decoration:none;box-shadow:0 14px 26px -12px rgba(10,74,102,.55)}
.cta:hover{color:#FFFFFF;filter:brightness(1.06)}
.lb{font-size:16px;font-weight:600;color:#4A5F68}
.in{font:inherit;font-size:19px;font-weight:500;height:58px;padding:0 18px;border:1.5px solid #BCD3DA;border-radius:16px;background:#FFFFFF;color:#0E2733;box-sizing:border-box;width:100%}
.in:focus{outline:none;border-color:#0D7385;box-shadow:0 0 0 4px #CDEDF3}
.eye{position:absolute;right:6px;top:6px;width:46px;height:46px;border:none;border-radius:12px;background:transparent;color:#4A5F68;display:flex;align-items:center;justify-content:center;cursor:pointer}
.eye:focus-visible{outline:3px solid #0D7385}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 26px; background: linear-gradient(180deg, #E1F3F8 0%, #F3FAFC 40%); color: #0E2733; font-family: 'Onest', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 14px">
<a class="back" href="OnbMedicamento.dc.html" aria-label="Atrás"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
<div role="progressbar" aria-label="Paso 6 de 7" aria-valuemin="1" aria-valuemax="7" aria-valuenow="6" style="flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px"><span class="seg on"></span><span class="seg on"></span><span class="seg on"></span><span class="seg on"></span><span class="seg on"></span><span class="seg on"></span><span class="seg"></span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
<h1 style="margin: 0; font-size: 32px; line-height: 1.12; font-weight: 800; letter-spacing: -0.8px">Guarda tu rutina</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #4A5F68">Con tu cuenta no la pierdes si cambias de celular, y tu familia puede acompañarte.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lb" for="correo">Correo</label>
<input class="in" id="correo" type="email" autocomplete="email" placeholder="tu@correo.com">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lb" for="clave">Contraseña</label>
<div style="position: relative">
<input class="in" id="clave" type="{{tipo}}" autocomplete="new-password" aria-describedby="clave-ayuda" style="padding-right: 60px">
<button class="eye" type="button" onClick="{{ver}}" aria-label="{{txtVer}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
<span id="clave-ayuda" style="font-size: 14px; color: #4A5F68">Mínimo 8 caracteres.</span>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
<a class="cta" href="Vincular.dc.html">Crear cuenta</a>
<p style="margin: 0; font-size: 15px; text-align: center; color: #4A5F68">¿Solo cuidas a alguien? <a href="Codigo.dc.html">Ingresa su código</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const visible = !!(this.state && this.state.visible);
return {
tipo: visible ? 'text' : 'password',
txtVer: visible ? 'Ocultar contraseña' : 'Mostrar contraseña',
ver: () => this.setState({ visible: !visible }),
};
}
}
</script>
</body>
</html>
