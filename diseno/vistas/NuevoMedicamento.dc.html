.chip{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:18px;background:#FFFFFF;border:2px solid #D6E5EA;font-size:15px;font-weight:600;color:#2C4853;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip:has(input:checked){border-color:#0D7385;background:#F0F9FB;color:#0A4A66}

.day{position:relative;height:44px;border-radius:14px;background:#FFFFFF;border:2px solid #D6E5EA;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#2C4853;cursor:pointer}
